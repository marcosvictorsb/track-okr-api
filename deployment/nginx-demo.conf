# Configuração Nginx para Track OKR - Ambiente de Demonstração
# Arquivo: /etc/nginx/sites-available/gunno-demo

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name demonstracao.gunno.com.br;
    return 301 https://demonstracao.gunno.com.br$request_uri;
}

# HTTPS Demo Environment
server {
    listen 443 ssl http2;
    server_name demonstracao.gunno.com.br;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/demonstracao.gunno.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demonstracao.gunno.com.br/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Demo Environment Header
    add_header X-Environment "Demo" always;

    # Logs
    access_log /opt/trackokr/demo/logs/nginx-access.log combined;
    error_log /opt/trackokr/demo/logs/nginx-error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Frontend Vue.js - Demo
    location / {
        root /opt/trackokr/demo/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Cache mais curto para demo (para updates frequentes)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, must-revalidate";
            access_log off;
        }
        
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # API Demo - Port 3002
    location /api/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Environment "Demo";
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer sizes
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3002/health;
        access_log off;
    }

    # Demo data reset endpoint (apenas para demo)
    location /api/demo/reset {
        proxy_pass http://127.0.0.1:3002/api/demo/reset;
        # Rate limit mais restritivo para reset
        limit_req zone=demo_reset burst=1 nodelay;
    }

    # Rate limiting mais relaxado para demo
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3002/api/auth/;
        # ... outros headers proxy
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /README|/\.env|/package\.json {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Banner de ambiente demo
    location /demo-banner {
        add_header Content-Type text/plain;
        return 200 "AMBIENTE DE DEMONSTRAÇÃO - NÃO USE DADOS REAIS";
    }
}
