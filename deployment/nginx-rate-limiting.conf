# Configuração de Rate Limiting para Nginx
# Adicionar ao bloco http{} em /etc/nginx/nginx.conf

http {
    # Rate limiting zones
    
    # Produção - mais restritivo
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
    
    # Demo - mais permissivo para demonstrações
    limit_req_zone $binary_remote_addr zone=demo_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=demo_api:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=demo_reset:10m rate=1r/h;
    
    # Limite por tamanho de upload
    client_max_body_size 10M;
    
    # Buffers
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
    
    # Log format personalizado
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        '"$host" sn="$server_name" '
                        'rt=$request_time '
                        'ua="$upstream_addr" us="$upstream_status" '
                        'ut="$upstream_response_time" ul="$upstream_response_length" '
                        'cs=$upstream_cache_status';
    
    # Incluir configurações dos sites
    include /etc/nginx/sites-enabled/*;
}
